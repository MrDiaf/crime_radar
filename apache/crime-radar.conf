<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/crime-radar

    <Directory /var/www/crime-radar>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # Keep the writable database outside the public document root in production.
    SetEnv CRIME_RADAR_DB_PATH /var/lib/crime-radar/crime-radar.sqlite

    ErrorLog ${APACHE_LOG_DIR}/crime-radar-error.log
    CustomLog ${APACHE_LOG_DIR}/crime-radar-access.log combined
</VirtualHost>
